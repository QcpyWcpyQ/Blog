<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="880" height="305" viewBox="0 0 880 305" role="img">
  <title id="title">Continuity of f and g on X</title>
  <desc id="desc">On the first closed interval, g has a jump. On the half-open interval, f is discontinuous at the included left endpoint and at one interior point. Along the points 4 − 1/n, f tends to f(4) and g does not tend to g(4). Both functions are continuous at the isolated points.</desc>
